$kind: http-request
name: verify-otp
method: POST
url: '{{base_url}}/api/v1/auth/otp/verify'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "msisdn": "2348012345678",
      "code": "123456",
      "purpose": "LOGIN"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Response time is acceptable", function () {
        pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("OTP verify returns valid response", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201, 400, 401]);
      });
      if (pm.response.code === 200) {
        const json = pm.response.json();
        if (json.data && json.data.accessToken) {
          pm.environment.set("access_token", json.data.accessToken);
          pm.environment.set("refresh_token", json.data.refreshToken);
        }
      }
